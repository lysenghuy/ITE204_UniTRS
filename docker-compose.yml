version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: unitrs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: unitrs_db
      MYSQL_USER: unitrs_user
      MYSQL_PASSWORD: unitrs_password
    ports:
      - "3307:3306"
    volumes:
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  web:
    build: .
    container_name: unitrs-web
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/unitrs_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: unitrs_user
      DB_PASSWORD: unitrs_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
